<mjml>
  <mj-head>
    <mj-title>הודעה חדשה מ{{sender_name}}</mj-title>
    <mj-preview>{{preheader}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="'Noto Serif Hebrew', Arial, sans-serif" />
      <mj-section background-color="#fafafa" padding="0 36px" />
      <mj-column padding="0" />
      <mj-text color="#0f172a" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#0f172a" color="#ffffff" border-radius="6px" font-size="15px" font-weight="700" inner-padding="14px 28px" padding="0" align="right" />
      <mj-image padding="0" />
      <mj-class name="h" font-family="'Noto Serif Hebrew', Arial, sans-serif" font-weight="700" />
      <mj-class name="muted" color="#64748b" />
    </mj-attributes>
    <mj-style>
      @media (max-width:480px) { .hero-h div { font-size:26px !important; line-height:1.15 !important; } }
    </mj-style>
  </mj-head>
  <mj-body background-color="#ffffff" width="600px" direction="rtl">
    <mj-wrapper padding="28px 12px" background-color="#ffffff">
      <mj-section background-color="#0f172a" padding="24px 36px" border-radius="6px 6px 0 0">
        <mj-column>
          <mj-image src="https://media.base44.com/images/public/69ef99e5583af6a64ca3772e/20bf75ee2_logo.png" alt="Consenz" width="40px" align="center" padding="0 0 12px" />
          <mj-text align="center" font-size="12px" letter-spacing="4px" font-weight="700" text-transform="uppercase" color="#ffffff">Consenz</mj-text>
        </mj-column>
      </mj-section>
      <mj-section padding="40px 36px 8px">
        <mj-column>
          <mj-text mj-class="h hero-h" font-size="26px" line-height="1.25" padding="0 0 16px">{{greeting}}, {{recipient_name}}.</mj-text>
          <mj-text font-size="16px" line-height="1.7" padding="0 0 16px">{{intro}}</mj-text>
        </mj-column>
      </mj-section>
      <mj-section padding="0 36px 8px">
        <mj-column background-color="#fafafa" border-left="3px solid #0f172a" border-radius="6px" padding="16px 20px">
          <mj-text font-size="15px" line-height="1.7" color="#0f172a" padding="0">{{message_preview}}</mj-text>
        </mj-column>
      </mj-section>
      <mj-section padding="16px 36px 32px">
        <mj-column>
          <mj-button href="{{cta_url}}">{{cta_label}}</mj-button>
        </mj-column>
      </mj-section>
      <mj-section background-color="#0f172a" padding="26px 36px 30px" border-radius="0 0 6px 6px">
        <mj-column>
          <mj-text mj-class="h" align="center" font-size="17px" color="#ffffff" padding="0 0 8px">Consenz</mj-text>
          <mj-text align="center" font-size="12px" line-height="1.7" color="#ffffff" padding="0">{{footer_note}}</mj-text>
        </mj-column>
      </mj-section>
    </mj-wrapper>
  </mj-body>
</mjml>
