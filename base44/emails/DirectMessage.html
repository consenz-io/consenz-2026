<mjml>
  <mj-head>
    <mj-title>הודעה חדשה מ{{sender_name}}</mj-title>
    <mj-preview>{{preheader}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="'Noto Serif Hebrew', Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-column padding="0" />
      <mj-text color="#0f172a" font-size="15px" line-height="1.7" padding="0" />
      <mj-button background-color="#0f172a" color="#ffffff" border-radius="6px" font-size="15px" font-weight="700" inner-padding="14px 28px" padding="0" align="{{text_align}}" />
      <mj-image padding="0" />
      <mj-class name="h" font-family="'Noto Serif Hebrew', Arial, sans-serif" font-weight="700" />
      <mj-class name="muted" color="#64748b" />
      <mj-class name="label" font-size="11px" letter-spacing="2px" text-transform="uppercase" color="#64748b" font-weight="700" />
    </mj-attributes>
    <mj-style>
      @media (max-width:480px) { .hero-h div { font-size:23px !important; line-height:1.2 !important; } }
    </mj-style>
  </mj-head>
  <mj-body background-color="#ffffff" width="600px" direction="rtl">
    <mj-wrapper padding="28px 12px" background-color="#ffffff">

      <mj-section background-color="#0f172a" padding="26px 36px" border-radius="6px 6px 0 0">
        <mj-column>
          <mj-image src="https://media.base44.com/images/public/69ef99e5583af6a64ca3772e/20bf75ee2_logo.png" alt="Consenz" width="44px" align="center" padding="0 0 10px" />
          <mj-text align="center" font-size="12px" letter-spacing="4px" font-weight="700" text-transform="uppercase" color="#ffffff" padding="0">Consenz</mj-text>
        </mj-column>
      </mj-section>

      <mj-section padding="36px 36px 4px">
        <mj-column>
          <mj-text mj-class="h hero-h" align="{{text_align}}" font-size="26px" line-height="1.25" padding="0 0 12px">{{greeting}}, {{recipient_name}}.</mj-text>
          <mj-text mj-class="muted" align="{{text_align}}" font-size="16px" line-height="1.7" padding="0 0 22px">{{intro}}</mj-text>
        </mj-column>
      </mj-section>

      <mj-section padding="0 36px 8px">
        <mj-column background-color="#fafafa" border="1px solid #e5e7eb" border-radius="6px" padding="18px 22px">
          <mj-text mj-class="label" align="{{text_align}}" padding="0 0 10px">{{messageLabel}}</mj-text>
          <mj-text align="{{text_align}}" font-size="17px" line-height="1.6" color="#0f172a" padding="0 0 14px">{{message_preview}}</mj-text>
          <mj-divider border-color="#e5e7eb" border-width="1px" padding="0 0 12px" />
          <mj-text align="{{text_align}}" font-size="13px" line-height="1.6" color="#64748b" padding="0">{{fromLabel}} <span style="color:#0f172a;font-weight:700;">{{sender_name}}</span></mj-text>
        </mj-column>
      </mj-section>

      <mj-section padding="20px 36px 34px">
        <mj-column>
          <mj-button href="{{cta_url}}">{{cta_label}}</mj-button>
        </mj-column>
      </mj-section>

      <mj-section background-color="#0f172a" padding="26px 36px 30px" border-radius="0 0 6px 6px">
        <mj-column>
          <mj-text mj-class="h" align="center" font-size="17px" color="#ffffff" padding="0 0 8px">Consenz</mj-text>
          <mj-text align="center" font-size="12px" line-height="1.7" color="#ffffff" padding="0">{{footer_note}}</mj-text>
        </mj-column>
      </mj-section>

    </mj-wrapper>
  </mj-body>
</mjml>
